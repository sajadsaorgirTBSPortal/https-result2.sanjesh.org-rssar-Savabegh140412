<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>استعلام دانشنامه - دانشگاه آزاد اسلامی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#1B2A5B;
    --navy-mid:#2B3E7E;
    --sky:#E8EAF6;
    --paper:#EEF0F8;
    --ink:#1A1A1A;
    --ink-soft:#5B6472;
    --line:#DDE2EF;
    --ok:#2F6B4F;
    --ok-bg:#E7F1EA;
    --ok-line:#BFDBC9;
    --err:#A63B2A;
    --err-bg:#F7E9E4;
    --blue-btn:#2455C4;
    --red-btn:#B7402E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Vazirmatn', sans-serif;
    background:#DDE2E9;
    color:var(--ink);
    min-height:100vh;
    line-height:1.7;
  }

  main{max-width:520px;margin:0 auto;padding:0 20px 60px;}

  .brand-logo {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    margin: 0 -20px 20px -20px;
    padding: 0;
    background: #fff;
  }
  .brand-logo img {
    width: 100%;
    height: auto;
    max-height: none;
    display: block;
    object-fit: cover;
  }

  .card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:18px;
    padding:34px 28px;
    box-shadow:0 8px 24px rgba(27,42,91,0.08);
    margin-top: 0;
  }

  .intro-text{
    text-align:center;
    margin-bottom:28px;
  }
  .intro-text h2{
    margin:0 0 12px;font-size:18px;font-weight:700;color:#1E3FC4;
  }
  .intro-text p{
    margin:0;font-size:14px;color:var(--ink-soft);
  }

  .field{margin-bottom:22px;}
  .field label{
    display:block;font-size:14px;font-weight:600;margin-bottom:10px;color:var(--navy-deep);
  }
  .field input{
    width:100%;
    padding:14px 16px;
    font-family:inherit;
    font-size:15px;
    text-align:center;
    border:1px solid #D8DCE3;
    border-radius:10px;
    background:#fff;
    color:var(--ink);
  }
  .field input::placeholder{color:#A6ACB8;}
  .field input:focus{
    outline:none;
    border-color:var(--blue-btn);
    background:#fff;
  }

  .captcha-row{
    display:flex;align-items:center;gap:12px;margin-bottom:22px;
    direction:ltr;justify-content:flex-start;
  }
  .captcha-row canvas{
    border:1px solid #D8DCE3;
    border-radius:10px;
    background:#fff;
    flex:none;
  }
  .captcha-input{width:120px;flex:none;}
  .captcha-input input{
    width:100%;padding:12px 10px;font-family:inherit;font-size:15px;text-align:center;
    border:1px solid #D8DCE3;border-radius:10px;background:#fff;color:var(--ink);
  }
  .captcha-input input::placeholder{color:#A6ACB8;font-size:13px;}
  .refresh-btn{
    background:none;border:none;cursor:pointer;font-size:18px;color:var(--navy-mid);
    padding:6px;flex:none;
  }

  button.submit{
    width:100%;
    background:var(--blue-btn);
    color:#fff;
    border:none;
    padding:14px;
    font-family:inherit;
    font-size:15.5px;
    font-weight:700;
    border-radius:12px;
    cursor:pointer;
  }
  button.submit:disabled{background:#9AA4B0;cursor:progress;}

  .back-link{
    display:block;text-align:center;margin-top:20px;
    font-size:14px;color:#3A4A7A;text-decoration:none;
  }

  .captcha-error{
    font-size:12.5px;color:var(--err);margin-top:-14px;margin-bottom:18px;display:none;
  }
  .captcha-error.show{display:block;}

  .result-view{display:none;}
  .result-view.show{display:block;}

  .status-banner{
    border-radius:10px;
    padding:18px 20px;
    margin-bottom:18px;
    text-align:center;
  }
  .status-banner.ok{background:var(--ok-bg);border:1px solid var(--ok-line);}
  .status-banner.err{background:var(--err-bg);border:1px solid #E3BEB3;}
  .status-banner .title{font-weight:800;font-size:16px;margin-bottom:6px;}
  .status-banner.ok .title{color:var(--ok);}
  .status-banner.err .title{color:var(--err);}
  .status-banner .sub{font-size:13px;color:var(--ink-soft);}

  .person-card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    text-align:center;
  }
  .person-name-section{
    background:#EEF1FA;
    padding:24px 20px;
  }
  .person-name{font-size:18px;font-weight:800;color:var(--navy-deep);margin-bottom:14px;}
  .id-badge{
    display:inline-block;
    background:#fff;
    border:1px solid var(--line);
    border-radius:8px;
    padding:9px 16px;
    font-size:14px;
    color:var(--navy-mid);
    font-weight:600;
  }
  .attr{
    padding:18px 20px;
    background:#F7F8FB;
    border-top:1px solid var(--line);
  }
  .attr:nth-of-type(odd){background:#fff;}
  .attr .k{font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;}
  .attr .v{font-size:15.5px;font-weight:700;color:var(--navy-deep);}

  .result-actions{margin-top:22px;display:flex;flex-direction:column;gap:12px;}
  button.action-blue, button.action-red{
    width:100%;
    border:none;
    padding:14px;
    font-family:inherit;
    font-size:15px;
    font-weight:700;
    border-radius:10px;
    cursor:pointer;
    color:#fff;
  }
  button.action-blue{background:var(--blue-btn);}
  button.action-red{background:var(--red-btn);}

  .note{
    margin-top:26px;
    padding-top:18px;
    border-top:1px solid var(--line);
    font-size:12px;
    color:var(--ink-soft);
    text-align:center;
  }
</style>
</head>
<body>

<main>

  <div class="brand-logo">
    <img src="https://cdn.imgurl.ir/uploads/i322905_Islamic_Azad_University_Medical_Branch_of_Tehran_Logo.jpg" alt="دانشگاه آزاد اسلامی - علوم پزشکی تهران">
  </div>

  <div class="card" id="formCard">
    <div class="intro-text">
      <h2>استعلام دانشنامه</h2>
      <p>لطفاً کد تایید دانشنامه خود را وارد کنید</p>
    </div>

    <form id="inquiryForm">
      <div class="field">
        <label for="trackingCode">کد تایید دانشنامه / گواهی موقت پایان تحصیلات:</label>

        <input type="text" id="trackingCode" inputmode="numeric" maxlength="12" placeholder="شماره دانشنامه خود را وارد کنید">

        <div class="captcha-error" id="codeError" style="margin-top:8px;">لطفاً شماره دانشنامه خود را وارد کنید.</div>
      </div>

      <label style="display:block;font-size:14px;font-weight:600;margin-bottom:10px;color:var(--navy-deep);">تایید امنیتی:</label>
      <div class="captcha-row">
        <canvas id="captchaCanvas" width="140" height="56"></canvas>
        <div class="captcha-input">
          <input type="text" id="captchaAnswer" placeholder="جواب" required>
        </div>
        <button type="button" class="refresh-btn" id="refreshCaptcha" title="تغییر کد">⟳</button>
      </div>
      <div class="captcha-error" id="captchaError">پاسخ تایید امنیتی صحیح نیست.</div>

      <button type="submit" class="submit" id="submitBtn">بررسی دانشنامه</button>
    </form>

    <a href="#" class="back-link">بازگشت به صفحه اصلی</a>
  </div>

  <div class="result-view" id="resultView">
    <div class="status-banner" id="statusBanner">
      <div class="title" id="statusTitle"></div>
      <div class="sub" id="statusSub"></div>
    </div>

    <div class="person-card" id="personCard" style="display:none;">
      <div class="person-name-section">
        <div class="person-name" id="pName"></div>
        <div class="id-badge">کد ملی: <span id="pNid"></span></div>
      </div>

      <div class="attr">
        <div class="k">رشته تحصیلی</div>
        <div class="v" id="pField"></div>
      </div>
      <div class="attr">
        <div class="k">مقطع تحصیلی</div>
        <div class="v" id="pDegree"></div>
      </div>
      <div class="attr">
        <div class="k">واحد</div>
        <div class="v" id="pUnit"></div>
      </div>
    </div>

    <div class="result-actions">
      <button type="button" class="action-blue" id="issueBtn">صدور گواهی استعلام</button>
      <button type="button" class="action-red" id="restartBtn">شروع مجدد</button>
    </div>
  </div>

  <p class="note"></p>
</main>

<script>
// داده‌های آزمایشی - در نسخه واقعی با API سرور جایگزین می‌شود
const demoRecords = {
  "140165980214": {
    name: "فاطمه برادری",
    nationalId: "۰۰۵۴۵۲۸۷۷۱",
    field: "روانشناسی بالینی",
    degree: "کارشناسی ارشد",
    unit: "تهران مرکزی"
  },
  "140365215474": {
    name: "محمد طاهر تمهیدی",
    nationalId: "۱۴۰۵۸۵۳۲۰۲۵۴",
    field: "پزشکی عمومی",
    degree: "دکتری",
    unit: "علوم‌پزشکی-تهران"
  },
  "140065874121": {
    name: "میلاد استادپور",
    nationalId: "۱۳۹۲۸۴۵۳۸۷",
    field: "مدیریت بازرگانی",
    degree: "کارشناسی",
    unit: "واحد تهران مرکزی"
  },
  "140554601594": {
    name: "هادی افروزی",
    nationalId: "۲۰۰۳۲۹۸۱۵۰",
    field: "کاردرمانی",
    degree: "کارشناسی",
    unit: "واحد علوم پزشکی تهران"
  },
  "2300844125": {
    name: "حامد شفیعیان",
    nationalId: "۲۳۰۰۸۴۴۱۲۵",
    field: "مهندسی تکنولوژی کامپیوتر نرم افزار",
    degree: "کارشناسی",
    unit: "شیراز"
  },
  "140065326587": {
    name: "سیده سمیه رجبی",
    nationalId: "۱۴۰۰۶۵۳۲۶۵۸۷",
    field: "اتاق عمل",
    degree: "کارشناسی",
    unit: "علوم پزشکی تهران"
  },
  "139965326587": {
    name: "مصطفی کرامت",
    nationalId: "۱۷۴۱۸۰۰۲۵۰",
    field: "مهندسی صنایع گرایش تحلیل سیستم ها",
    degree: "کارشناسی ناپیوسته",
    unit: "واحد تهران مرکزی"
  },
  "140365213254": {
    name: "مسعود همتی",
    nationalId: "۴۹۴۹۰۰۸۳۴۱",
    field: "حسابداری",
    degree: "کارشناسی ناپیوسته",
    unit: "واحد تهران مرکزی"
  },
  "140574325874": {
    name: "رضا باقری پلمی",
    nationalId: "۱۸۳۰۱۰۳۴۵۸",
    field: "ایمنی بهداشت کار HSE",
    degree: "کاردانی",
    unit: "واحد اهواز"
  },
  "140574328741": {
    name: "صفر عباسی",
    nationalId: "۱۹۷۱۵۷۱۶۲۸",
    field: "مکانیک صنایع",
    degree: "کاردانی",
    unit: "اهواز"
  },
  "140265321454": {
    name: "نامشخص",
    nationalId: "۳۰۷۱۲۱۶۶۳۷",
    field: "مهندسی حرفه ای ایمنی صنعتی",
    degree: "کارشناسی",
    unit: "بندرعباس"
  }
};

const formCard = document.getElementById('formCard');
const resultView = document.getElementById('resultView');
const statusBanner = document.getElementById('statusBanner');
const statusTitle = document.getElementById('statusTitle');
const statusSub = document.getElementById('statusSub');
const personCard = document.getElementById('personCard');
const submitBtn = document.getElementById('submitBtn');
const captchaError = document.getElementById('captchaError');

// تبدیل اعداد فارسی/عربی به انگلیسی
function toEnglishDigits(str){
  const persian = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
  const arabic  = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
  return str.split('').map(ch => {
    let i = persian.indexOf(ch);
    if(i > -1) return i;
    i = arabic.indexOf(ch);
    if(i > -1) return i;
    return ch;
  }).join('');
}

// کپچای ساده
let captchaAnswer = 0;
const canvas = document.getElementById('captchaCanvas');
const ctx = canvas.getContext('2d');

function drawCaptcha(){
  const a = Math.floor(Math.random()*9)+1;
  const b = Math.floor(Math.random()*9)+1;
  captchaAnswer = a + b;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = '#FAFBFC';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.font = '600 22px Vazirmatn, sans-serif';
  ctx.fillStyle = '#1B2A5B';
  ctx.textBaseline = 'middle';
  ctx.fillText(a + ' + ' + b + ' = ?', 14, 30);
  ctx.strokeStyle = 'rgba(43,62,126,0.3)';
  for(let i=0;i<4;i++){
    ctx.beginPath();
    ctx.moveTo(Math.random()*canvas.width, Math.random()*canvas.height);
    ctx.lineTo(Math.random()*canvas.width, Math.random()*canvas.height);
    ctx.stroke();
  }
}
drawCaptcha();
document.getElementById('refreshCaptcha').addEventListener('click', drawCaptcha);

document.getElementById('inquiryForm').addEventListener('submit', function(e){
  e.preventDefault();
  const code = toEnglishDigits(document.getElementById('trackingCode').value.trim());
  const userAnswer = toEnglishDigits(document.getElementById('captchaAnswer').value.trim());
  const codeError = document.getElementById('codeError');

  if(!code){
    codeError.classList.add('show');
    return;
  }
  codeError.classList.remove('show');

  if(parseInt(userAnswer, 10) !== captchaAnswer){
    captchaError.classList.add('show');
    drawCaptcha();
    document.getElementById('captchaAnswer').value = '';
    return;
  }
  captchaError.classList.remove('show');

  submitBtn.disabled = true;
  submitBtn.textContent = 'در حال بررسی...';

  setTimeout(function(){
    const record = demoRecords[code];
    formCard.style.display = 'none';
    resultView.classList.add('show');

    if(record){
      statusBanner.className = 'status-banner ok';
      statusTitle.textContent = 'اطلاعات دانشنامه معتبر است';
      statusSub.textContent = 'اطلاعات دانش‌آموخته معتبر و مورد تایید است';
      document.getElementById('pName').textContent = record.name;
      document.getElementById('pNid').textContent = record.nationalId;
      document.getElementById('pField').textContent = record.field;
      document.getElementById('pDegree').textContent = record.degree;
      document.getElementById('pUnit').textContent = record.unit;
      personCard.style.display = 'block';
    } else {
      statusBanner.className = 'status-banner err';
      statusTitle.textContent = 'موردی یافت نشد';
      statusSub.textContent = 'اطلاعات واردشده با هیچ رکوردی مطابقت ندارد';
      personCard.style.display = 'none';
    }
    submitBtn.disabled = false;
    submitBtn.textContent = 'بررسی دانشنامه';
  }, 700);
});

document.getElementById('restartBtn').addEventListener('click', function(){
  resultView.classList.remove('show');
  formCard.style.display = 'block';
  document.getElementById('inquiryForm').reset();
  drawCaptcha();
});

document.getElementById('issueBtn').addEventListener('click', function(){
  alert('در نسخه واقعی، این دکمه یک فایل PDF گواهی صادر می‌کند.');
});
</script>

</body>
</html>
